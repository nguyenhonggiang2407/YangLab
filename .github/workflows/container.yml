name: Container smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify the container
        shell: bash
        run: |
          set -Eeuo pipefail
          image="yanglab-smoke:${GITHUB_SHA}"
          container="yanglab-smoke"
          base="http://127.0.0.1:13100"

          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker ps -a --filter "name=^/${container}$" || true
              docker inspect --format '{{json .State}}' "$container" || true
              docker logs "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT

          docker build --tag "$image" .
          docker run --detach --name "$container" \
            --publish 127.0.0.1:13100:3100 \
            --memory 512m --cpus 1 \
            --env YANGLAB_ALLOWED_HOSTS=localhost,127.0.0.1 \
            "$image"

          ready=0
          for attempt in {1..45}; do
            if curl --fail --silent --max-time 3 "$base/health" > health.json; then
              ready=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
              exit 1
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' health.json

          curl --fail --silent --show-error --max-time 10 "$base/" > home.html
          grep -Fq '<title>YangLab' home.html
          curl --fail --silent --show-error --max-time 10 \
            "$base/assets/favicon.svg" > favicon.svg
          grep -Fq '<svg' favicon.svg
